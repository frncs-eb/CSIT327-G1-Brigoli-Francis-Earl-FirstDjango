{% extends "base.html" %}

{% block title %}CampusConnect - Log in{% endblock %}

{% block content %}
<section class="content-card form-card auth-card">
    <p class="eyebrow">CampusConnect</p>
    <h1 class="page-heading">Welcome back</h1>
    <p class="muted-copy mb-4">Log in to continue to your campus community.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn btn-primary w-100 py-2" type="submit">Log in</button>
    </form>

    <p class="text-center muted-copy mt-4 mb-0">
        New to CampusConnect? <a href="{% url 'signup' %}">Create an account</a>
    </p>
</section>
{% endblock %}
